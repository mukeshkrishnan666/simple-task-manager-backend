plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mukesh'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    
    // Jackson JSR310 for LocalDateTime support
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    runtimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ============================================================================
// Angular Frontend Integration Tasks
// ============================================================================

def frontendDir = "$projectDir/../simple-task-manager-frontend"

task buildFrontend(type: Exec) {
    group = 'build'
    description = 'Builds the Angular frontend'
    workingDir frontendDir
    
    inputs.dir("$frontendDir/src")
    outputs.dir("$frontendDir/dist/simple-task-manager-frontend/browser")
    
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'cmd', '/c', 'npm install && npm run build'
    } else {
        commandLine 'sh', '-c', 'npm install && npm run build'
    }
}

task copyFrontend(type: Copy) {
    dependsOn buildFrontend
    group = 'build'
    description = 'Copies Angular build to Spring Boot static resources'
    
    from "$frontendDir/dist/simple-task-manager-frontend/browser"
    into "$buildDir/resources/main/static"
}

// Ensure the frontend is built and copied before Spring Boot processes resources
processResources {
    dependsOn copyFrontend
}